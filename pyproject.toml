[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "axon_meta_quest"
version = "2.0.0"
description = "Read Meta Quest controller poses and buttons over ADB and publish them as an AXOn node."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # AXOn is not on PyPI.
    "axon",
    # Both already come with axon: numpy is imported directly here, and
    # neuracore_types (an axon dependency) imports yaml without declaring it.
    "numpy",
    "pyyaml",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
]

[tool.uv.sources]
axon = { git = "https://github.com/NeuracoreAI/neuracore_axon", branch = "main" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axon_meta_quest = ["APK/*.apk", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
